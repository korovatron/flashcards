<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diya's AQA A Level Computer Science Flashcards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="images/logo.png" alt="Logo" class="logo">
  <h1>Diya's AQA A Level Computer Science Flashcards</h1>
</header>

<div class="controls-bar">
  <label>
    Unit
    <select id="select-unit">
      <option value="unit1">Unit 1</option>
      <option value="unit2">Unit 2</option>
    </select>
  </label>

  <label>
    Section
    <select id="select-section"></select>
  </label>

  <label>
    Order
    <select id="select-order">
      <option value="order">Sequential</option>
      <option value="random">Random</option>
    </select>
  </label>
</div>

<main id="app">

  <section id="screen-loading" class="screen">
    <p>Loading flashcards&hellip;</p>
  </section>

  <section id="screen-error" class="screen">
    <p id="error-message" class="error-text"></p>
  </section>

  <section id="screen-card" class="screen">
    <div class="section-tag" id="section-tag"></div>
    <div class="progress" id="progress"></div>

    <div class="card-scene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="card-label">Question</div>
          <div class="card-text" id="card-front-text"></div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Answer</div>
          <div class="card-text" id="card-back-text"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-prev">&#9664; Previous</button>
      <button id="btn-reveal">Show answer</button>
      <button id="btn-next">Next &#9654;</button>
    </div>

    <div class="secondary-controls">
      <button id="btn-restart" class="link-btn">Restart deck</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
